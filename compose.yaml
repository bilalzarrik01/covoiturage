services:
  postgres:
    image: postgres:17
    container_name: covoiturage-postgres
    environment:
      POSTGRES_DB: covoiturage_db
      POSTGRES_USER: covoiturage_user
      POSTGRES_PASSWORD: covoiturage_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
